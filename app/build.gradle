plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alya.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alya.assistant'
        minSdk 29
        targetSdk 35
        versionCode (System.getenv('APP_VERSION_CODE')?.toInteger() ?: 1)
        versionName (System.getenv('APP_VERSION_NAME') ?: '0.1.0')
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}